apply plugin: 'maven-publish'

task androidSourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    if (project.plugins.findPlugin("com.android.library")) {
        from android.sourceSets.main.java.srcDirs
        from android.sourceSets.main.kotlin.srcDirs
    } else {
        from sourceSets.main.java.srcDirs
        from sourceSets.main.kotlin.srcDirs
    }
}

artifacts {
    archives androidSourcesJar
}

group = PUBLISH_GROUP_ID
version = PUBLISH_VERSION

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId PUBLISH_GROUP_ID
                artifactId PUBLISH_ARTIFACT_ID
                version PUBLISH_VERSION

                if (project.plugins.findPlugin("com.android.library")) {
                    from components.release
                } else {
                    artifact("$buildDir/libs/${project.getName()}-${version}.jar")
                }

                artifact androidSourcesJar

                pom {
                    name = PUBLISH_ARTIFACT_ID
                    description = 'Optimized High Performance Neumorphism UI library for Android Compose & Views'
                    url = 'https://github.com/obieda-hussien/neumorphic-compose-pro'
                    licenses {
                        license {
                            name = 'Apache License, Version 2.0'
                            url = 'https://github.com/obieda-hussien/neumorphic-compose-pro/blob/main/LICENSE'
                        }
                    }
                    developers {
                        developer {
                            id = 'obieda-hussien'
                            name = 'Obieda Hussien'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/obieda-hussien/neumorphic-compose-pro.git'
                        developerConnection = 'scm:git:ssh://github.com/obieda-hussien/neumorphic-compose-pro.git'
                        url = 'https://github.com/obieda-hussien/neumorphic-compose-pro'
                    }
                }
            }
        }
    }
}
