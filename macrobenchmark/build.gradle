plugins {
    id 'com.android.test'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'me.nikhilchaudhari.neumorphiccompose.macrobenchmark'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    targetProjectPath ':app'

    buildTypes {
        benchmark {
            // The benchmark module is a test APK. Keep R8 disabled here so the
            // benchmark/test runtime dependencies remain intact. The tested app
            // still uses its production-like, minified :app:benchmark build type.
            minifyEnabled false
            matchingFallbacks = ['release']
        }
    }
}

dependencies {
    implementation libs.androidx.benchmark.macro.junit4
}
