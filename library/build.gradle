plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}


ext {
    PUBLISH_GROUP_ID = 'io.github.obieda-hussien'
    PUBLISH_VERSION = '4.0.0'
    PUBLISH_ARTIFACT_ID = 'library'
}


apply from: "${rootProject.projectDir}/scripts/publish-module.gradle"


android {

    namespace 'me.nikhilchaudhari.library'

    compileSdk 36


    defaultConfig {

        minSdk 24
        targetSdk 36

        versionCode 5
        versionName '4.0.0'

        testInstrumentationRunner =
                'androidx.test.runner.AndroidJUnitRunner'

        consumerProguardFiles(
                'consumer-rules.pro'
        )
    }


    buildTypes {

        release {

            minifyEnabled false

            proguardFiles(
                    getDefaultProguardFile(
                            'proguard-android-optimize.txt'
                    ),
                    'proguard-rules.pro'
            )
        }
    }


    /*
     * Publish the release Android variant.
     *
     * This keeps the Maven publication compatible with
     * both JitPack and normal Maven publishing.
     */
    publishing {

        singleVariant('release') {
        }
    }


    compileOptions {

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    kotlinOptions {

        jvmTarget = '17'
    }


    buildFeatures {

        compose true
    }


    testOptions {

        unitTests {

            returnDefaultValues = true
        }
    }
}


dependencies {

    /*
     * Compose BOM
     */
    api platform(
            libs.compose.bom
    )


    /*
     * AndroidX
     */
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.profileinstaller


    /*
     * Compose public API
     */
    api libs.androidx.compose.ui
    api libs.androidx.compose.ui.graphics

    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.foundation


    /*
     * Material 3 is visible from the public API.
     */
    api libs.androidx.compose.material3


    /*
     * Animation
     */
    implementation libs.androidx.compose.animation
    implementation libs.androidx.compose.animation.core
    implementation libs.androidx.compose.animation.graphics


    /*
     * Tests
     */
    testImplementation libs.junit

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core


    /*
     * Debug tooling
     */
    debugImplementation libs.androidx.compose.ui.tooling
}
