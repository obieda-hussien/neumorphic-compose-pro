plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.0'
}

ext {
    PUBLISH_GROUP_ID = 'me.nikhilchaudhari'
    PUBLISH_VERSION = '3.1.0'
    PUBLISH_ARTIFACT_ID = 'composeNeumorphism'
}

apply from: "${rootProject.projectDir}/scripts/publish-module.gradle"

android {
    namespace 'me.nikhilchaudhari.library'
    compileSdk 36

    defaultConfig {
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName "3.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Publishes the release variant as a Maven/JitPack artifact. Without this,
    // AGP warns "Android Publication 'release' Misconfigured for Variant
    // 'release'" during every build, since the publish-module.gradle script
    // (applied above) creates a publication that expects this to exist.
    publishing {
        singleVariant("release") {}
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    testOptions {
        unitTests {
            // NeuPerformanceConfigTest exercises NeuShadowCache.resizeBudget(),
            // which calls android.util.LruCache.resize() - a real Android
            // framework method that the default unit-test android.jar stubs
            // out (throws "not mocked"). returnDefaultValues makes such calls
            // no-op/return-default instead of throwing, which is enough here
            // since these tests only assert on NeuPerformanceConfig's own
            // pure-Kotlin state, not on LruCache's internal behavior.
            returnDefaultValues = true
        }
    }
}

dependencies {
    // Compose BOM - `api` so this version alignment propagates to consumers
    // of the published AAR too, not just within this module.
    api platform(libs.compose.bom)

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material

    // Installs this library's bundled baseline-prof.txt on the consuming
    // app's device so ART can compile/verify the hot classes ahead of time
    // instead of interpreting them on first use. See src/main/baseline-prof.txt.
    implementation libs.androidx.profileinstaller

    // Compose UI - `api`, not `implementation`: this library's own public
    // functions return `Modifier` and take `Color`/`Dp` parameters
    // (Neumorphic.kt), so consumers need these types resolvable from just
    // depending on this library. `implementation` would compile fine here
    // but leave external JitPack consumers with "unresolved reference"
    // errors unless they *also* separately declared compose-ui themselves.
    api libs.androidx.compose.ui
    api libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.foundation

    // Material Design 3 - `api` for the same reason as compose-ui:
    // NeuTheme.fromMaterial3ColorScheme(colorScheme: ColorScheme = ...) puts
    // androidx.compose.material3.ColorScheme directly in this library's
    // public API surface.
    api libs.androidx.compose.material3

    // Animation - internal use only (springNeumorphic/animatedNeumorphic take
    // plain Float/Int/the library's own NeuAnimationType enum, never expose
    // androidx.compose.animation types directly), so implementation is correct.
    implementation libs.androidx.compose.animation
    implementation libs.androidx.compose.animation.core
    implementation libs.androidx.compose.animation.graphics

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core

    // Debug tooling
    debugImplementation libs.androidx.compose.ui.tooling
}