plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

ext {
    PUBLISH_GROUP_ID = 'me.nikhilchaudhari'
    PUBLISH_VERSION = '2.1.0'
    PUBLISH_ARTIFACT_ID = 'neumorphismViews'
}

apply from: "${rootProject.projectDir}/scripts/publish-module.gradle"

android {
    namespace 'me.nikhilchaudhari.library.views'
    compileSdk 36

    defaultConfig {
        // Must be >= :library's minSdk (24) since this module depends on it -
        // a lower value here fails the manifest merge ("uses-sdk:minSdkVersion
        // X cannot be smaller than version 24 declared in library manifest").
        // This module was previously pinned to minSdk 21 despite already
        // depending on :library, which was a latent bug.
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "2.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // See the identical block in library/build.gradle for why this is needed.
    publishing {
        singleVariant("release") {}
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material

    // `api`, not `implementation`: NeumorphicView/Button/CardView expose
    // `me.nikhilchaudhari.library.LightSource` directly in their public
    // properties (e.g. `var neuLightSource: LightSource`), so consumers of
    // this module need :library's types resolvable transitively.
    api project(path: ':library')

    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
}
