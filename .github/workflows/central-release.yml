name: Stage Central release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify signing configuration
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_PASSWORD"
      - name: Test and stage signed artifacts
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: bash gradlew :library:testReleaseUnitTest :library:lintRelease :library:publishReleasePublicationToCentralStagingRepository :library-views:publishReleasePublicationToCentralStagingRepository --no-daemon
      - name: Create validated bundle
        run: python3 scripts/central-bundle.py build/central-staging build/central-bundle.zip
      - uses: actions/upload-artifact@v7
        with:
          name: central-release-bundle
          path: build/central-bundle.zip
          retention-days: 14
