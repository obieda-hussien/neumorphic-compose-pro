name: Android CI Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            **/build/reports/tests/
          retention-days: 14

  lint:
    name: Run Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lint --no-daemon

      - name: Upload Lint Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-results
          path: |
            **/build/reports/lint-results*.html
          retention-days: 14

  instrumentation:
    name: Instrumented & Compose UI Tests
    runs-on: macos-15-intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Stabilize ADB daemon
        run: |
          adb kill-server || true
          adb start-server
          adb wait-for-device || true

      - name: Run Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 1
          ram-size: 2048M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-snapshot-load -no-snapshot-save -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics -camera-back none
          disable-animations: true
          pre-emulator-launch-script: |
            adb kill-server || true
            adb start-server
            adb devices
          script: |
            set -u

            wait_for_device() {
              for attempt in $(seq 1 90); do
                state="$(adb -s emulator-5554 get-state 2>/dev/null || true)"
                boot="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                if [ "$state" = "device" ] && [ "$boot" = "1" ]; then
                  adb -s emulator-5554 shell pm path android >/dev/null 2>&1 && return 0
                fi
                sleep 2
              done
              echo "Emulator did not reach a usable ADB/package-manager state."
              adb devices -l || true
              return 1
            }

            wait_for_device
            adb -s emulator-5554 shell input keyevent 82 || true

            for attempt in 1 2 3; do
              echo "Instrumented test attempt $attempt/3"
              if ./gradlew connectedDebugAndroidTest --no-daemon --no-parallel --max-workers=1; then
                exit 0
              fi

              echo "Instrumented tests failed on attempt $attempt. Reconnecting ADB before retry."
              adb disconnect emulator-5554 || true
              adb reconnect device || true
              adb start-server || true
              wait_for_device || true
              sleep 5
            done

            echo "Instrumented tests failed after 3 attempts."
            adb devices -l || true
            exit 1

      - name: Upload Instrumented Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-test-results
          path: |
            **/build/outputs/androidTest-results/
            **/build/reports/androidTests/
          retention-days: 14

  benchmark:
    name: Macrobenchmark Smoke Tests
    runs-on: macos-15-intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Stabilize ADB daemon
        run: |
          adb kill-server || true
          adb start-server
          adb wait-for-device || true

      - name: Run Macrobenchmarks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 1
          ram-size: 2048M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-snapshot-load -no-snapshot-save -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics -camera-back none
          disable-animations: true
          pre-emulator-launch-script: |
            adb kill-server || true
            adb start-server
            adb devices
          script: |
            set -u

            wait_for_device() {
              for attempt in $(seq 1 90); do
                state="$(adb -s emulator-5554 get-state 2>/dev/null || true)"
                boot="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                if [ "$state" = "device" ] && [ "$boot" = "1" ]; then
                  adb -s emulator-5554 shell pm path android >/dev/null 2>&1 && return 0
                fi
                sleep 2
              done
              echo "Emulator did not reach a usable ADB/package-manager state."
              adb devices -l || true
              return 1
            }

            wait_for_device
            adb -s emulator-5554 shell input keyevent 82 || true

            for attempt in 1 2 3; do
              echo "Macrobenchmark attempt $attempt/3"
              if ./gradlew :macrobenchmark:connectedBenchmarkAndroidTest --no-daemon --no-parallel --max-workers=1; then
                exit 0
              fi

              echo "Macrobenchmark failed on attempt $attempt. Reconnecting ADB before retry."
              adb disconnect emulator-5554 || true
              adb reconnect device || true
              adb start-server || true
              wait_for_device || true
              sleep 5
            done

            echo "Macrobenchmarks failed after 3 attempts."
            adb devices -l || true
            exit 1

      - name: Upload Macrobenchmark Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macrobenchmark-results
          path: |
            macrobenchmark/build/outputs/
            macrobenchmark/build/reports/
          retention-days: 30
